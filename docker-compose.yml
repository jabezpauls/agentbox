# agentbox — base stack.
#
# Every service below is deliberately unprivileged and unable to reach the host:
# no Docker socket, no host bind mounts, all capabilities dropped. The only
# service that publishes a port is the proxy, and which address it binds to is
# decided by the mode overlay (docker-compose.standalone.yml or
# docker-compose.behind-proxy.yml) rather than here.

x-sandbox: &sandbox
  # The context is the repository root, not images/workspace: the Dockerfile's
  # first stage compiles the Workbench out of web/ so the image carries it.
  build:
    context: .
    dockerfile: images/workspace/Dockerfile
    args:
      NODE_MAJOR: "22"
  image: agentbox/workspace:latest
  restart: unless-stopped
  # UID/GID 1000 inside the image. Never root.
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  cpus: ${AGENTBOX_CPUS:-2}
  mem_limit: ${AGENTBOX_MEMORY:-4g}
  volumes:
    # A named volume, NOT a host path: the sandbox cannot see the host filesystem.
    - workspace:/workspace
    - home:/home/coder
  environment:
    TZ: ${TZ:-UTC}
    # Optional agent credentials, passed through only if you set them.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  # VS Code in the browser: files, editor, integrated terminal, and the coding
  # agents installed in the image.
  code:
    <<: *sandbox
    command:
      - code-server
      - --bind-addr=0.0.0.0:8080
      - --auth=none          # the proxy authenticates; see proxy/Caddyfile.*
      - --disable-telemetry
      - --disable-update-check
      - /workspace
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # herdr's client, full-screen: the agent multiplexer, for driving agent
  # panes as a TUI (handy on a phone).
  terminal:
    <<: *sandbox
    # --check-origin: a ttyd websocket is a live shell, and websocket
    # handshakes are not covered by the same-origin policy, so any page in
    # another tab could otherwise attach on the browser's cached credentials.
    # ttyd compares the Origin against the Host the proxy forwards, which is
    # the same hostname the page was served from.
    command: ["ttyd", "--port", "7681", "--base-path", "/terminal", "--check-origin", "--writable", "herdr"]
    # Same localhost and process table as the editor: a dev server started in
    # one is reachable from all, and the proxy reaches every port via `code`.
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code

  # A plain shell, for when you want bash rather than the herdr client.
  shell:
    <<: *sandbox
    # --check-origin for the same reason as `terminal`.
    command: ["ttyd", "--port", "7683", "--base-path", "/shell", "--check-origin", "--writable", "bash", "-l"]
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code

  # Live resource usage for the sandbox itself.
  monitor:
    <<: *sandbox
    # --check-origin for the same reason as `terminal`.
    command: ["ttyd", "--port", "7682", "--base-path", "/monitor", "--check-origin", "btop"]
    # Same localhost and process table as the editor: a dev server started in
    # one is reachable from all, and the proxy reaches every port via `code`.
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code

  # The Workbench: a browser client for herdr — agents, live terminals,
  # previews of the servers they start, and the Review surface agents publish
  # artifacts to. Shares the editor's network and process namespaces, so it
  # sees the same localhost ports and the same process table.
  workbench:
    <<: *sandbox
    command: ["agentbox-workbench"]
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code
    # `environment` is a mapping, so the anchor's copy is replaced rather than
    # merged: every key this service needs is restated here.
    environment:
      TZ: ${TZ:-UTC}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Blank means path previews only; set it and each port also gets its own
      # hostname, which is a separate origin and needs no iframe sandbox.
      WORKBENCH_PREVIEW_DOMAIN: ${AGENTBOX_PREVIEW_DOMAIN:-}
      # `path` (default) allows opt-in public shares under /s/<token>; `off`
      # refuses to mint or serve them and hides the panel's Share action.
      WORKBENCH_PREVIEW_MODE: ${AGENTBOX_PREVIEW_MODE:-path}
      # Only used to print a clickable link from `agentbox-review open`; unset,
      # the bridge falls back to whatever Host the request arrived with.
      WORKBENCH_PUBLIC_URL: ${AGENTBOX_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7800/workbench/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - code
    security_opt:
      - no-new-privileges:true
    # The proxy verifies a bcrypt hash on every authentication attempt, which
    # is deliberately slow. Without a ceiling, an unauthenticated flood of
    # Authorization headers turns that cost into a CPU-exhaustion attack on
    # whatever else shares the host. A cap makes the flood the proxy's problem
    # and no one else's; a rate limit in front of it (see the reverse-proxy
    # overlays) keeps it from becoming even that.
    cpus: ${AGENTBOX_PROXY_CPUS:-1}
    mem_limit: ${AGENTBOX_PROXY_MEMORY:-256m}
    pids_limit: 256
    networks:
      - internal
    environment:
      AGENTBOX_DOMAIN: ${AGENTBOX_DOMAIN:-localhost}
      AGENTBOX_USER: ${AGENTBOX_USER:-admin}
      AGENTBOX_PASSWORD_HASH: ${AGENTBOX_PASSWORD_HASH:?run install.sh to generate a password hash}
      # Always defined so the Caddyfile's placeholders resolve; when it is
      # empty the preview hostname rules can never match anything.
      AGENTBOX_PREVIEW_DOMAIN: ${AGENTBOX_PREVIEW_DOMAIN:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

networks:
  internal:
    name: agentbox_internal
    driver: bridge

volumes:
  workspace:
    name: agentbox_workspace
  home:
    name: agentbox_home
  caddy_data:
  caddy_config:
