# agentbox — base stack.
#
# Every service below is deliberately unprivileged and unable to reach the host:
# no Docker socket, no host bind mounts, all capabilities dropped. The only
# service that publishes a port is the proxy, and which address it binds to is
# decided by the mode overlay (docker-compose.standalone.yml or
# docker-compose.behind-proxy.yml) rather than here.
#
# Every request goes proxy → gate → sandbox. The gate decides who gets in, and
# it lives outside the sandbox (its own image, user and volume), because the
# sandbox runs agents and anything it holds an agent can change.

x-sandbox: &sandbox
  # The context is the repository root, not images/workspace: the Dockerfile's
  # first stage compiles the Workbench out of web/ so the image carries it.
  build:
    context: .
    dockerfile: images/workspace/Dockerfile
    args:
      NODE_MAJOR: "22"
      # Which coding agents to bake in; the installer's --agents flag writes
      # this, so a rebuild (install or `agentbox update`) re-applies the choice.
      # `-`, not `:-`: an unset key means the default pair, but a key set empty
      # (`--agents ''`) means no agents at all.
      AGENTS: ${AGENTBOX_AGENTS-claude,codex}
  image: agentbox/workspace:latest
  restart: unless-stopped
  # UID/GID 1000 inside the image. Never root.
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  cpus: ${AGENTBOX_CPUS:-2}
  mem_limit: ${AGENTBOX_MEMORY:-4g}
  volumes:
    # A named volume, NOT a host path: the sandbox cannot see the host filesystem.
    - workspace:/workspace
    - home:/home/coder
  environment:
    TZ: ${TZ:-UTC}
    # Optional agent credentials, passed through only if you set them.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  # VS Code in the browser: files, editor, integrated terminal, and the coding
  # agents installed in the image.
  code:
    <<: *sandbox
    command:
      - code-server
      - --bind-addr=0.0.0.0:8080
      - --auth=none          # the gate authenticates; see web/gate
      - --disable-telemetry
      - --disable-update-check
      - /workspace
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # herdr's client, full-screen: the agent multiplexer, for driving agent
  # panes as a TUI (handy on a phone).
  terminal:
    <<: *sandbox
    # --check-origin: a ttyd websocket is a live shell, and websocket
    # handshakes are not covered by the same-origin policy, so any page in
    # another tab could otherwise attach on the browser's cached credentials.
    # ttyd compares the Origin against the Host the proxy forwards, which is
    # the same hostname the page was served from.
    command: ["ttyd", "--port", "7681", "--base-path", "/terminal", "--check-origin", "--writable", "herdr"]
    # Same localhost and process table as the editor: a dev server started in
    # one is reachable from all, and the proxy reaches every port via `code`.
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code

  # A plain shell, for when you want bash rather than the herdr client.
  shell:
    <<: *sandbox
    # --check-origin for the same reason as `terminal`.
    command: ["ttyd", "--port", "7683", "--base-path", "/shell", "--check-origin", "--writable", "bash", "-l"]
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code

  # Live resource usage for the sandbox itself.
  monitor:
    <<: *sandbox
    # --check-origin for the same reason as `terminal`.
    command: ["ttyd", "--port", "7682", "--base-path", "/monitor", "--check-origin", "btop"]
    # Same localhost and process table as the editor: a dev server started in
    # one is reachable from all, and the proxy reaches every port via `code`.
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code

  # The Workbench: a browser client for herdr — agents, live terminals,
  # previews of the servers they start, and the Review surface agents publish
  # artifacts to. Shares the editor's network and process namespaces, so it
  # sees the same localhost ports and the same process table.
  workbench:
    <<: *sandbox
    command: ["agentbox-workbench"]
    network_mode: "service:code"
    pid: "service:code"
    depends_on:
      - code
    # `environment` is a mapping, so the anchor's copy is replaced rather than
    # merged: every key this service needs is restated here.
    environment:
      TZ: ${TZ:-UTC}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Public `/s/<token>` shares stay off: the bridge would decide who may see
      # them, and the bridge is inside the sandbox. The gate admits nobody
      # without a session, so a share link could only ever open for the owner.
      # (Per-port preview hostnames are gone for the same reason: the session
      # cookie is host-only and never reaches another hostname.)
      WORKBENCH_PREVIEW_MODE: "off"
      # Only used to print a clickable link from `agentbox-review open`; unset,
      # the bridge falls back to whatever Host the request arrived with.
      WORKBENCH_PUBLIC_URL: ${AGENTBOX_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7800/workbench/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The front door: sign-in, sessions, two-factor, device tokens, rate limits,
  # and the routing of every request to the services above — with every
  # front-door credential stripped before anything reaches the sandbox.
  # Outside the sandbox on purpose: its own image and user (10001, not 1000),
  # its own volume, which no sandbox container mounts.
  gate:
    build:
      context: .
      dockerfile: images/gate/Dockerfile
    image: agentbox/gate:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      # The admin socket `agentbox-gate` talks to, and nothing else.
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The gate runs bcrypt, which is deliberately slow. Its rate limits refuse
    # a flood before any bcrypt work, and this ceiling bounds what is left, so
    # nothing else on the host pays for a guesser.
    cpus: ${AGENTBOX_GATE_CPUS:-1}
    mem_limit: ${AGENTBOX_GATE_MEMORY:-256m}
    pids_limit: 128
    # `front` to hear from the proxy, `internal` to reach the sandbox's services.
    networks:
      - front
      - internal
    depends_on:
      - code
    environment:
      TZ: ${TZ:-UTC}
      AGENTBOX_USER: ${AGENTBOX_USER:-admin}
      # Seeds a fresh store only. Afterwards the gate's store is the source of
      # truth: ./scripts/agentbox passwd changes the password there.
      AGENTBOX_PASSWORD_HASH: ${AGENTBOX_PASSWORD_HASH:?run install.sh to generate a password hash}
      AGENTBOX_PUBLIC_URL: ${AGENTBOX_PUBLIC_URL:-}
      # The one peer whose X-Agentbox-Client-IP (the client address the proxy
      # worked out) is believed. Everyone else, the sandbox included, is keyed
      # on the address it connects from.
      GATE_TRUSTED_PROXIES: proxy
    volumes:
      - gate:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7900/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # TLS where it terminates (standalone), compression, and nothing else: it
  # forwards every request to the gate and decides nothing about who gets in.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - gate
    security_opt:
      - no-new-privileges:true
    cpus: ${AGENTBOX_PROXY_CPUS:-1}
    mem_limit: ${AGENTBOX_PROXY_MEMORY:-256m}
    pids_limit: 256
    # `front` only: the sandbox is on `internal` and cannot reach the proxy at
    # all, so nothing inside it can send a request that arrives at the gate
    # from the proxy's address.
    networks:
      - front
    environment:
      AGENTBOX_DOMAIN: ${AGENTBOX_DOMAIN:-localhost}
      # A header the operator's own proxy writes the client address into,
      # read first when the peer is a trusted proxy (see proxy/trust/). Not
      # AGENTBOX_CLIENT_IP_HEADER, an older key that meant something else and
      # may still be in .env.
      AGENTBOX_REAL_IP_HEADER: ${AGENTBOX_REAL_IP_HEADER:-}
    volumes:
      - ./proxy/trust:/etc/caddy/trust:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  internal:
    name: agentbox_internal
    driver: bridge
  # The proxy and the gate, and nothing else.
  front:
    name: agentbox_front
    driver: bridge

volumes:
  workspace:
    name: agentbox_workspace
  home:
    name: agentbox_home
  # The gate's store: password hash, sessions, two-factor, device tokens.
  gate:
    name: agentbox_gate
  caddy_data:
  caddy_config:
