name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/agentbox scripts/install-herdr.sh \
            scripts/isolate-host.sh \
            images/workspace/entrypoint.sh \
            images/workspace/agentbox-workbench \
            images/gate/agentbox-gate \
            tests/proxy/gate-bypass.sh tests/install/*.sh

      - name: Validate Compose files
        run: |
          # A placeholder hash so the required variable resolves; the real one
          # is written by install.sh.
          cp .env.example .env
          sed -i 's|^AGENTBOX_PASSWORD_HASH=.*|AGENTBOX_PASSWORD_HASH=$$2a$$14$$placeholderplaceholderplaceholderplaceholder|' .env
          for mode in standalone behind-proxy traefik; do
            docker compose -f docker-compose.yml -f "docker-compose.$mode.yml" config -q
          done
          # The traefik overlay must never publish a port: Traefik reaches the
          # proxy over the Docker network, and nothing else should reach it.
          if docker compose -f docker-compose.yml -f docker-compose.traefik.yml config | grep -q '^ *ports:'; then
            echo "the traefik overlay publishes a port" >&2
            exit 1
          fi

      - name: What a re-run of the installer keeps
        run: tests/install/env-preserve.sh

      - name: The host-isolation rules apply idempotently
        # Applied inside a throwaway container's own network namespace.
        run: tests/install/isolate-rules.sh

  proxy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Caddy configuration
        # Compose validation cannot catch a malformed Caddyfile; an undefined
        # snippet or a renamed directive only fails when the proxy starts.
        run: |
          for file in Caddyfile.standalone Caddyfile.behind-proxy; do
            docker run --rm -v "$PWD/proxy:/p:ro" -e AGENTBOX_DOMAIN=example.com \
              caddy:2-alpine caddy validate --adapter caddyfile --config "/p/$file"
          done

  gate-bypass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nothing gets past the gate
        # Builds the gate image, then runs the real Caddyfiles in the real Caddy
        # image in front of it, with echo servers for every sandbox port: no
        # unauthenticated path, header or WebSocket trick reaches the sandbox,
        # no front-door credential arrives there, and sign-in locks out.
        run: tests/proxy/gate-bypass.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install herdr
        # The same pinned, checksum-verified build the sandbox image installs,
        # from the same script — the end-to-end tests and the image can never
        # be on different herdr releases.
        run: |
          sudo scripts/install-herdr.sh /usr/local/bin

      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: web/app
      - name: End-to-end against a real herdr
        run: npm run e2e -w app
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/app/playwright-report
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sandbox image
        # The context is the repository root: the Dockerfile's first stage
        # compiles the Workbench out of web/.
        run: docker build -t agentbox/workspace:ci -f images/workspace/Dockerfile .
      - name: The agents must actually be present
        run: |
          docker run --rm agentbox/workspace:ci bash -lc 'command -v code-server && command -v ttyd && command -v btop && command -v herdr && command -v tmux && command -v gh && command -v agentbox-workbench && command -v agentbox-review'
      - name: The Workbench bridge must actually run
        run: |
          docker run --rm agentbox/workspace:ci \
            node /usr/local/lib/agentbox-workbench/bridge/bridge/src/main.js --help
      - name: Build the gate image
        run: docker build -t agentbox/gate:ci -f images/gate/Dockerfile .
      - name: The gate must run unprivileged, and its admin command work
        run: |
          test "$(docker run --rm --entrypoint id agentbox/gate:ci -u)" = 10001
          docker run --rm agentbox/gate:ci node /app/dist/main.js --help
          printf 'a-ci-password\n' | docker run --rm -i --entrypoint agentbox-gate agentbox/gate:ci hash-password \
            | grep -q '^\$2[aby]\$14\$'
