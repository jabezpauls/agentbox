name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/agentbox images/workspace/entrypoint.sh

      - name: Validate Compose files
        run: |
          # A placeholder hash so the required variable resolves; the real one
          # is written by install.sh.
          cp .env.example .env
          sed -i 's|^AGENTBOX_PASSWORD_HASH=.*|AGENTBOX_PASSWORD_HASH=$$2a$$14$$placeholderplaceholderplaceholderplaceholder|' .env
          for mode in standalone behind-proxy; do
            docker compose -f docker-compose.yml -f "docker-compose.$mode.yml" config -q
          done

  proxy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Caddy configuration
        # Compose validation cannot catch a malformed Caddyfile; an undefined
        # snippet or a renamed directive only fails when the proxy starts.
        run: |
          for f in proxy/Caddyfile.standalone proxy/Caddyfile.behind-proxy; do
            docker run --rm -v "$PWD/proxy:/p:ro" \
              -e AGENTBOX_DOMAIN=example.com \
              -e AGENTBOX_USER=ci \
              -e AGENTBOX_PASSWORD_HASH='placeholder' \
              caddy:2-alpine caddy validate --adapter caddyfile \
              --config "/p/$(basename "$f")"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sandbox image
        run: docker build -t agentbox/workspace:ci images/workspace
      - name: The agents must actually be present
        run: |
          docker run --rm agentbox/workspace:ci bash -lc 'command -v code-server && command -v ttyd && command -v btop && command -v herdr && command -v tmux && command -v gh && command -v lavish-axi'
